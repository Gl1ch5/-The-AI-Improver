# Пример: AI Improver за nginx с TLS. Стриминг требует proxy_buffering off.
server {
    listen 443 ssl;
    server_name improver.example.com;
    ssl_certificate     /etc/letsencrypt/live/improver.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/improver.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

